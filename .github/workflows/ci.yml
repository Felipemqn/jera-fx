name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: jera-fx:ci

      - name: Validate docker compose (base)
        run: docker compose config > /dev/null

      - name: Validate docker compose (prod override)
        env:
          POSTGRES_DB: jera_fx
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql+psycopg://ci:ci@db:5432/jera_fx
          CORS_ALLOWED_ORIGINS: https://example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
