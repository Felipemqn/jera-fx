version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jera_fx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jera_fx
      APP_ENV: production
      SERIES_CATALOG_PATH: config/series_catalog.yml
    ports:
      - "8000:8000"
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn jera_fx_api.main:app --host 0.0.0.0 --port 8000
      "

  client-web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/client-web:/app
    ports:
      - "3000:3000"
    command: python -m http.server 3000

  investment-web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/investment-web:/app
    ports:
      - "3001:3001"
    command: python -m http.server 3001

  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jera_fx
      SERIES_CATALOG_PATH: config/series_catalog.yml
    command: python -m jera_fx_api.scheduler
    profiles:
      - refresh

volumes:
  pgdata:
