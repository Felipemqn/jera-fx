# ─────────────────────────────────────────────────────────
# Production override for docker-compose.yml
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires .env file with production secrets
# (see .env.example for the full list).
# ─────────────────────────────────────────────────────────

services:
  db:
    # Remove public port exposure — only accessible inside the compose network
    ports: !reset []
    restart: unless-stopped
    # Harden: fail fast if password not set
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

  api:
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}

  client-web:
    restart: unless-stopped

  investment-web:
    restart: unless-stopped

  scheduler:
    # In production, run the scheduler as a persistent service that loops
    # every SCHEDULER_INTERVAL_SECONDS (default 24h) instead of the
    # one-shot command from the base compose.
    restart: unless-stopped
    # Remove the "refresh" profile restriction — always run in prod
    profiles: !reset []
    command: ["/app/scripts/scheduler-loop.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-86400}

  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - pgbackups:/backups
    command: ["/usr/local/bin/backup.sh"]

volumes:
  pgbackups:
