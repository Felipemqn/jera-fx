tactical_signal:
  required_drivers:
    - driver_key: reer_120_br
      label: BRL REER broad
      category: structural
      series_key: reer_120_br
      required_for_signal: true
      notes: Canonical client default scale is 2020 average equals 100.
    - driver_key: reer_51_br
      label: BRL REER narrow
      category: structural
      series_key: reer_51_br
      required_for_signal: true
      notes: Canonical client default scale is 2020 average equals 100.
    - driver_key: ptax_usd_brl_sell
      label: PTAX USD/BRL sell
      category: spot
      series_key: ptax_usd_brl_sell
      required_for_signal: true
      notes: Latest spot and monthly close are both exposed in the tactical inputs snapshot.
    - driver_key: sgs_selic_target_rate
      label: Selic target rate
      category: domestic-macro
      series_key: sgs_selic_target_rate
      required_for_signal: true
    - driver_key: focus_exchange_rate_median_2026
      label: Focus BRL/USD median 2026
      category: expectations
      series_key: focus_exchange_rate_median_2026
      required_for_signal: true
    - driver_key: focus_exchange_rate_median_2027
      label: Focus BRL/USD median 2027
      category: expectations
      series_key: focus_exchange_rate_median_2027
      required_for_signal: true
    - driver_key: focus_exchange_rate_median_2028
      label: Focus BRL/USD median 2028
      category: expectations
      series_key: focus_exchange_rate_median_2028
      required_for_signal: true
    - driver_key: focus_exchange_rate_median_2029
      label: Focus BRL/USD median 2029
      category: expectations
      series_key: focus_exchange_rate_median_2029
      required_for_signal: true
    - driver_key: focus_ipca_median_2026
      label: Focus IPCA median 2026
      category: expectations
      series_key: focus_ipca_median_2026
      required_for_signal: true
    - driver_key: focus_ipca_median_2027
      label: Focus IPCA median 2027
      category: expectations
      series_key: focus_ipca_median_2027
      required_for_signal: true
    - driver_key: focus_ipca_median_2028
      label: Focus IPCA median 2028
      category: expectations
      series_key: focus_ipca_median_2028
      required_for_signal: true
    - driver_key: focus_ipca_median_2029
      label: Focus IPCA median 2029
      category: expectations
      series_key: focus_ipca_median_2029
      required_for_signal: true
    - driver_key: cds_brazil_5y
      label: Brazil 5Y CDS
      category: market
      series_key: cds_brazil_5y
      required_for_signal: true
      missing_reason: approved-internal-file-not-ingested
      source_type: approved internal
      source_mode: approved_internal_file_drop
      automation_mode: manual_batch
      production_ingestion_approved: true
      required_configuration: []
      notes: Approved internal manual CSV file drop for Brazil 5Y CDS. Tactical coverage is complete only after the file is ingested into raw.observations.
    - driver_key: broad_usd_index
      label: Broad USD index
      category: market
      series_key: broad_usd_index
      required_for_signal: true
      notes: Official H.10 broad dollar index from the Federal Reserve Board daily indexes package.
    - driver_key: commodity_terms_of_trade
      label: Commodity or terms-of-trade driver
      category: market
      series_key: commodity_terms_of_trade
      required_for_signal: true
      notes: Official BCB IC-Br in US dollars from the SGS API.
